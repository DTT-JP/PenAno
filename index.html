<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LabelMe Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Load Screen -->
  <div id="loadScreen" class="load-screen">
    <div class="load-card">
      <div class="load-logo">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="4" y="4" width="40" height="40" rx="8" fill="#1a1a2e"/>
          <rect x="10" y="10" width="28" height="20" rx="3" fill="#16213e"/>
          <rect x="13" y="13" width="22" height="14" rx="2" fill="#0f3460"/>
          <path d="M18 34h12M20 37h8" stroke="#e94560" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 20l4 4 8-8" stroke="#e94560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>LabelMe Editor</h1>
      <p class="load-subtitle">iPad + Apple Pencil対応<br>ローカルアノテーションツール</p>

      <div class="load-options">
        <button class="load-btn primary" id="btnLoadFolder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
          </svg>
          フォルダを開く
        </button>
        <button class="load-btn secondary" id="btnLoadZip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          ZIPファイルを開く
        </button>
      </div>

      <input type="file" id="fileInputFolder" webkitdirectory multiple accept="image/*,.json" style="display:none">
      <input type="file" id="fileInputZip" accept=".zip" style="display:none">

      <div id="loadProgress" class="load-progress hidden">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="progressText">読み込み中...</p>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">

    <!-- LANDSCAPE: sidebar left, canvas right -->
    <!-- PORTRAIT: canvas top, sidebar bottom -->

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">

        <!-- File Nav -->
        <section class="panel" id="panelNav">
          <div class="panel-header">
            <span class="panel-title">ナビゲーション</span>
            <button class="icon-btn" id="btnFullscreen" title="全画面">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/>
                <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
            </button>
          </div>

          <div class="file-nav">
            <button class="nav-btn" id="btnPrev">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15,18 9,12 15,6"/>
              </svg>
            </button>
            <div class="file-info">
              <div class="file-name" id="fileName">—</div>
              <div class="file-counter" id="fileCounter">0 / 0</div>
            </div>
            <button class="nav-btn" id="btnNext">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9,18 15,12 9,6"/>
              </svg>
            </button>
          </div>

          <!-- Progress Stats -->
          <div class="progress-stats">
            <div class="stat">
              <span class="stat-val" id="statTotal">0</span>
              <span class="stat-lbl">全枚数</span>
            </div>
            <div class="stat">
              <span class="stat-val" id="statDone">0</span>
              <span class="stat-lbl">確認済</span>
            </div>
            <div class="stat">
              <span class="stat-val" id="statLeft">0</span>
              <span class="stat-lbl">残り</span>
            </div>
          </div>

          <!-- Confirmed check -->
          <button class="check-btn" id="btnConfirm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20,6 9,17 4,12"/>
            </svg>
            <span id="confirmLabel">確認済みにする</span>
          </button>
        </section>

        <!-- Zoom Control -->
        <section class="panel" id="panelZoom">
          <div class="panel-header"><span class="panel-title">表示倍率</span></div>
          <div class="zoom-row">
            <button class="zoom-btn" id="btnZoomOut">−</button>
            <input type="number" id="zoomInput" value="100" min="10" max="500" step="10" class="zoom-input">
            <span class="zoom-pct">%</span>
            <button class="zoom-btn" id="btnZoomIn">＋</button>
          </div>
          <button class="zoom-reset" id="btnZoomReset">100%に戻す</button>
        </section>

        <!-- Mode -->
        <section class="panel" id="panelMode">
          <div class="panel-header"><span class="panel-title">編集モード</span></div>
          <div class="mode-switch">
            <button class="mode-btn active" id="btnModeSelect" data-mode="select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 3l14 9-7 1-4 7z"/>
              </svg>
              選択
            </button>
            <button class="mode-btn" id="btnModeAdd" data-mode="add">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
              追加
            </button>
          </div>
          <!-- Add mode label picker -->
          <div id="addLabelPicker" class="add-label-picker hidden">
            <span class="picker-hint">追加するラベル:</span>
            <select id="selectAddLabel" class="label-select"></select>
          </div>
        </section>

        <!-- Labels -->
        <section class="panel" id="panelLabels">
          <div class="panel-header">
            <span class="panel-title">ラベル一覧</span>
            <button class="icon-btn" id="btnAddLabel" title="ラベル追加">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>
          <div id="labelList" class="label-list"></div>
          <div id="addLabelForm" class="add-label-form hidden">
            <input type="text" id="newLabelInput" placeholder="ラベル名" class="text-input">
            <div class="form-row">
              <input type="color" id="newLabelColor" value="#e94560" class="color-picker">
              <button class="small-btn confirm-btn" id="btnConfirmAddLabel">追加</button>
              <button class="small-btn cancel-btn" id="btnCancelAddLabel">×</button>
            </div>
          </div>
        </section>

        <!-- Objects in current image -->
        <section class="panel" id="panelObjects">
          <div class="panel-header">
            <span class="panel-title">オブジェクト</span>
            <span class="badge" id="objCount">0</span>
          </div>
          <div id="objectList" class="object-list"></div>
        </section>

        <!-- Reload / Download -->
        <section class="panel panel-footer">
          <button class="load-btn primary small" id="btnDownloadZip" style="margin-bottom: 8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            ZIPで保存
          </button>
          <button class="load-btn secondary small" id="btnReload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1,4 1,10 7,10"/>
              <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
            </svg>
            別のデータを開く
          </button>
        </section>

      </div><!-- sidebar-inner -->
    </aside>

    <!-- Canvas Area -->
    <main id="canvasArea" class="canvas-area">
      <div id="canvasWrapper" class="canvas-wrapper">
        <canvas id="mainCanvas"></canvas>
        <!-- SVG overlay for annotations -->
        <svg id="annotSvg" class="annot-svg"></svg>
      </div>
    </main>

  </div><!-- app -->

  <!-- Scripts -->
  <script src="lib/jszip.min.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="canvas.js"></script>
  <script src="app.js"></script>
</body>
</html>
